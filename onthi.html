const app=document.querySelector("#app"), esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function loadPublic(){try{const [s,e]=await Promise.all([getDocs(query(collection(db,"examSubjects"),where("isPublished","==",true))),getDocs(query(collection(db,"exams"),where("isPublished","==",true)))]);SUBJECTS.splice(0,SUBJECTS.length,...s.docs.map(fromDoc).sort((a,b)=>(a.order??0)-(b.order??0)));EXAMS.splice(0,EXAMS.length,...e.docs.map(fromDoc).sort((a,b)=>(a.order??0)-(b.order??0)));loadError="";}catch(e){loadError=e.message||String(e);}}
const subject=id=>SUBJECTS.find(x=>x.id===Number(id)), testsFor=id=>EXAMS.filter(x=>Number(x.subjectId)===Number(id)&&x.isPublished!==false), testById=id=>EXAMS.find(x=>x.id===Number(id)&&x.isPublished!==false);
function shell(content){app.innerHTML=`<div class="shell"><header class="topbar"><a href="#/" class="brand"><span class="mark">✎</span>Ôn thi</a><nav class="nav"><a href="#/" class="${path()==="/"||path()===""?"active":""}">Môn học</a><a href="#/admin" class="${path()==="/admin"?"active":""}">Quản trị</a></nav><a href="./index.html" class="button ghost">⌂ Home</a></header><main class="main">${loadError?`<div class="notice" style="margin-bottom:16px">Không tải được dữ liệu từ Firebase: ${esc(loadError)}</div>`:""}${content}</main><footer class="footer">Ôn thi · Học từ đề thi do quản trị viên cung cấp.</footer></div>`;}
function home(){shell(`<div class="eyebrow">Thư viện đề thi</div><h1>Ôn thi</h1><p class="lead">Chọn môn học để xem các đề thi.</p><div class="grid">${SUBJECTS.map(s=>`<a class="card exam-subject" href="#/subject/${s.id}"><div class="row"><span class="exam-icon">${esc(s.icon||"📚")}</span><div><h2>${esc(s.title)}</h2><span class="chip">${testsFor(s.id).length} đề thi</span></div></div>${s.description?`<p class="lead">${esc(s.description)}</p>`:""}</a>`).join("")||`<div class="card empty">Chưa có môn học nào. Hãy quay lại sau nhé.</div>`}</div>`);}
function subjectPage(id){const s=subject(id);if(!s)return home();const ts=testsFor(id);shell(`<div class="toolbar"><a class="button ghost" href="#/">← Các môn học</a><span class="chip">${esc(s.icon||"📚")} ${esc(s.title)}</span></div><div class="eyebrow">Chọn đề thi</div><h1>${esc(s.title)}</h1><p class="lead">${esc(s.description||"Chọn đề để bắt đầu ôn tập.")}</p><div class="grid">${ts.map(t=>`<article class="card exam-test"><span class="eyebrow">${t.questions.length} câu hỏi</span><h2>${esc(t.title)}</h2>${t.description?`<p class="lead">${esc(t.description)}</p>`:""}<div class="meta"><span>${[...new Set(t.questions.map(q=>examTypeLabel[q.type]||"Câu hỏi"))].map(esc).join(" · ")}</span><a class="button" href="#/test/${t.id}">Bắt đầu →</a></div></article>`).join("")||`<div class="card empty">Môn này hiện chưa có đề thi.</div>`}</div>`);}
function setup(id){const t=testById(id);if(!t||!Array.isArray(t.questions)||!t.questions.length)return subjectPage("0");const s=subject(t.subjectId);shell(`<div class="toolbar"><a class="button ghost" href="#/subject/${s?.id||""}">← ${esc(s?.title||"Môn học")}</a><span class="chip">${t.questions.length} câu</span></div><div class="card"><div class="eyebrow">Sẵn sàng ôn tập</div><h1>${esc(t.title)}</h1><p class="lead">${esc(t.description||"Chọn chế độ làm bài phù hợp với bạn.")}</p><div class="grid" style="margin-top:20px"><button type="button" class="card answer" data-mode="chill"><span style="font-size:2rem">😌</span><h2>Chill</h2><p>Sau mỗi câu, bấm Nộp để xem đáp án ngay. Câu sai sẽ hiện giải thích từ đề thi.</p><span class="button">Chọn Chill →</span></button><button type="button" class="card answer" data-mode="hard"><span style="font-size:2rem">🔥</span><h2>Try hard</h2><p>Làm hết đề rồi mới nộp. Đáp án và giải thích chỉ hiện ở phần tổng kết.</p><span class="button secondary">Chọn Try hard →</span></button></div></div>`);document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{session={examId:t.id,mode:b.dataset.mode,index:0,answers:Array(t.questions.length).fill(null),locked:Array(t.questions.length).fill(false)};location.hash=`#/doing/${t.id}`;});}
const correct=(q,a)=>{if(q.type==="tf")return typeof a==="boolean"&&a===q.answer;if(q.type==="short"){const as=Array.isArray(q.answer)?q.answer:[q.answer],norm=x=>String(x??"").normalize("NFC").toLocaleLowerCase("vi").trim().replace(/\s+/g," ");return typeof a==="string"&&as.some(x=>norm(x)===norm(a));}return typeof a==="string"&&a===q.answer;};
const answerText=q=>q.type==="tf"?(q.answer?"Đúng":"Sai"):(Array.isArray(q.answer)?q.answer.join(" / "):String(q.answer??""));
const studentText=(q,a)=>q.type==="tf"?(a===true?"Đúng":a===false?"Sai":""):String(a??"");
function renderQuestion(){const z=session,t=z&&testById(z.examId);if(!z||!t)return home();const i=z.index,q=t.questions[i],a=z.answers[i],chill=z.mode==="chill",locked=z.locked[i],ok=locked&&correct(q,a),total=t.questions.length;let input="";if(q.type==="mc")input=`<div class="answer-list">${q.choices.map(c=>`<button class="answer${a===c?" sel":""}${locked&&c===q.answer?" right":""}${locked&&a===c&&c!==q.answer?" wrong":""}" data-choice="${esc(c)}" ${locked?"disabled":""}>${esc(c)}</button>`).join("")}</div>`;else if(q.type==="tf")input=`<div class="answer-list">${[true,false].map(v=>`<button class="answer${a===v?" sel":""}${locked&&v===q.answer?" right":""}${locked&&a===v&&a!==q.answer?" wrong":""}" data-tf="${v}" ${locked?"disabled":""}>${v?"Đúng":"Sai"}</button>`).join("")}</div>`;else input=`<label class="field" style="margin-top:16px"><span>Câu trả lời của bạn</span><input id="short" value="${esc(a||"")}" placeholder="Nhập câu trả lời…" ${locked?"disabled":""}></label>`;const feedback=locked?`<div class="fb ${ok?"right":"wrong"}">${ok?"✓ Chính xác!":`✗ Chưa đúng. Đáp án: <b>${esc(answerText(q))}</b>${q.explanation?`<br><br><b>Giải thích:</b> ${esc(q.explanation)}`:""}`}</div>`:"";const controls=chill?(locked?`<button class="button" id="next">${i===total-1?"Xem kết quả":"Câu tiếp →"}</button>`:`<button class="button" id="submit" ${a==null||a===""?"disabled":""}>Nộp câu</button>`):`<div class="row">${i>0?`<button class="button ghost" id="prev">← Trước</button>`:""}${i<total-1?`<button class="button" id="next">Câu tiếp →</button>`:`<button class="button" id="finish">Nộp bài</button>`}</div>`;shell(`<div class="toolbar"><button class="button ghost" id="exit">✕ Thoát</button><span class="chip">${chill?"😌 Chill":"🔥 Try hard"} · Câu ${i+1}/${total}</span></div><div class="exam-progress">${t.questions.map((_,k)=>`<span class="exam-dot${k===i?" current":""}${z.locked[k]?" done":""}">${k+1}</span>`).join("")}</div><div class="card"><div class="eyebrow">${esc(examTypeLabel[q.type])}</div><div class="exam-question">${esc(q.question)}</div></div>${input}${feedback}<div class="row" style="justify-content:center;margin-top:16px">${controls}</div>`);const m=document.querySelector("#app");m.querySelectorAll("[data-choice]").forEach(b=>b.onclick=()=>{z.answers[i]=b.dataset.choice;renderQuestion();});m.querySelectorAll("[data-tf]").forEach(b=>b.onclick=()=>{z.answers[i]=b.dataset.tf==="true";renderQuestion();});const short=m.querySelector("#short");if(short)short.oninput=()=>{z.answers[i]=short.value;const b=m.querySelector("#submit");if(b)b.disabled=!short.value.trim();};m.querySelector("#exit").onclick=()=>{if(confirm("Thoát bài thi? Tiến độ hiện tại sẽ bị xoá.")){session=null;location.hash=`#/test/${t.id}`;}};m.querySelector("#submit")?.addEventListener("click",()=>{z.locked[i]=true;renderQuestion();});m.querySelector("#prev")?.addEventListener("click",()=>{z.index--;renderQuestion();});m.querySelector("#next")?.addEventListener("click",()=>{if(chill&&i===total-1)return finish();if(chill&&!locked)return;z.index++;renderQuestion();});m.querySelector("#finish")?.addEventListener("click",finish);}
function finish(){const z=session,t=z&&testById(z.examId);if(!t)return;const blank=z.answers.filter(a=>a==null||a==="").length;if(blank&&!confirm(`Còn ${blank} câu chưa trả lời. Nộp bài?`))return;const results=t.questions.map((q,i)=>correct(q,z.answers[i])),score=results.filter(Boolean).length;shell(`<div class="card empty"><div class="eyebrow">Hoàn thành · ${z.mode==="chill"?"😌 Chill":"🔥 Try hard"}</div><h1>${Math.round(score/t.questions.length*100)}%</h1><p>Bạn đúng ${score}/${t.questions.length} câu.</p><div class="row" style="justify-content:center"><button class="button" id="again">Làm lại</button><a class="button secondary" href="#/subject/${t.subjectId}">Danh sách đề</a><a class="button ghost" href="#/">Các môn học</a></div></div><div class="section-head"><h2>Tổng hợp đáp án</h2></div>${t.questions.map((q,i)=>`<article class="card review ${results[i]?"right":"wrong"}"><div class="row"><b>${results[i]?"✓":"✗"}</b><span class="chip">Câu ${i+1} · ${esc(examTypeLabel[q.type])}</span></div><p class="exam-question">${esc(q.question)}</p><p>Bạn trả lời: <b>${esc(studentText(q,z.answers[i])||"(bỏ trống)")}</b></p><p>Đáp án: <b>${esc(answerText(q))}</b></p>${!results[i]&&q.explanation?`<p><b>Giải thích:</b> ${esc(q.explanation)}</p>`:""}</article>`).join("")}`);document.querySelector("#again").onclick=()=>{session={examId:t.id,mode:z.mode,index:0,answers:Array(t.questions.length).fill(null),locked:Array(t.questions.length).fill(false)};location.hash=`#/doing/${t.id}`;};}
async function adminLogin(){shell(`<div class="eyebrow">Quản trị</div><h1>Đăng nhập quản trị</h1><div class="card"><form id="login" class="row"><input type="password" name="pin" placeholder="Mã quản trị Firebase" required autocomplete="current-password"><button class="button">Mở khoá</button></form></div><p class="notice">Dùng mật khẩu tài khoản quản trị Firebase hiện tại của ứng dụng Hangul.</p>`);document.querySelector("#login").onsubmit=async e=>{e.preventDefault();const pin=String(new FormData(e.currentTarget).get("pin"));try{await authReady;await signInWithEmailAndPassword(auth,ADMIN_EMAIL,pin);adminPin=pin;await adminPage();}catch(err){alert(/invalid-credential|wrong-password|user-not-found|invalid-email|missing-password/.test(err.code||"")?"Sai mã quản trị.":err.message);}};}
function validateFile(d){if(!d||!Array.isArray(d.exams)||!d.exams.length)throw Error('File cần có danh sách "exams".');for(const [ei,e]of d.exams.entries()){if(!e||typeof e.title!=="string"||!e.title.trim()||!Array.isArray(e.questions)||!e.questions.length)throw Error(`Đề ${ei+1}: cần title và questions.`);for(const [qi,q]of e.questions.entries()){const at=`Đề ${ei+1}, câu ${qi+1}`;if(!q||typeof q.question!=="string"||!q.question.trim())throw Error(`${at}: thiếu question.`);if(q.type==="mc"){if(!Array.isArray(q.choices)||q.choices.length!==4||q.choices.some(x=>typeof x!=="string"||!x.trim()))throw Error(`${at}: mc cần đúng 4 choices dạng văn bản.`);if(typeof q.answer!=="string"||!q.choices.includes(q.answer))throw Error(`${at}: answer phải khớp một lựa chọn.`);}else if(q.type==="tf"){if(typeof q.answer!=="boolean")throw Error(`${at}: tf cần answer true hoặc false.`);}else if(q.type==="short"){if(!(typeof q.answer==="string"&&q.answer.trim())&&!(Array.isArray(q.answer)&&q.answer.length&&q.answer.every(x=>typeof x==="string"&&x.trim())))throw Error(`${at}: short cần answer là chuỗi hoặc mảng chuỗi.`);}else throw Error(`${at}: type phải là mc, tf hoặc short.`);if(q.explanation!=null&&typeof q.explanation!=="string")throw Error(`${at}: explanation phải là văn bản.`);}}return d.exams;}
async function adminPage(){if(adminPin===null)return adminLogin();try{const [ss,ee]=await Promise.all([getDocs(collection(db,"examSubjects")),getDocs(collection(db,"exams"))]);const subjects=ss.docs.map(fromDoc).sort((a,b)=>(a.order??0)-(b.order??0)),tests=ee.docs.map(fromDoc).sort((a,b)=>(a.order??0)-(b.order??0));const cards=subjects.map(s=>{const ts=tests.filter(t=>Number(t.subjectId)===s.id);return `<article class="card" style="margin-top:16px"><div class="row"><span class="exam-icon">${esc(s.icon||"📚")}</span><div style="flex:1"><h2>${esc(s.title)} ${s.isPublished===false?'<span class="chip">Đã ẩn</span>':""}</h2><small>${esc(s.description||"")}</small></div><div class="row"><button class="button sm ghost" data-action="toggle-subject" data-id="${s.id}">${s.isPublished===false?"Hiện":"Ẩn"}</button><button class="button sm ghost danger" data-action="delete-subject" data-id="${s.id}">Xoá môn</button></div></div><div class="section-head"><h3>Đề thi (${ts.length})</h3><label class="button sm">Tải đề JSON<input type="file" accept=".json,application/json" data-upload="${s.id}" hidden></label></div>${ts.map(t=>`<div class="item"><div><strong>${esc(t.title)}</strong> ${t.isPublished===false?'<span class="chip">Đã ẩn</span>':""}<br><small>${t.questions.length} câu · ${esc(t.sourceFileName||"File JSON")}</small></div><div class="row"><button class="button sm ghost" data-action="toggle-test" data-id="${t.id}">${t.isPublished===false?"Hiện":"Ẩn"}</button><button class="button sm ghost danger" data-action="delete-test" data-id="${t.id}">Xoá</button></div></div>`).join("")||`<p class="lead">Chưa có đề thi cho môn này.</p>`}</article>`;}).join("");shell(`<div class="eyebrow">Khu vực quản trị</div><div class="toolbar"><h1>Quản lý Ôn thi</h1><button id="logout" class="button ghost">Khoá quản trị</button></div><div class="card"><h2>Thêm môn học</h2><form id="add-subject" class="row"><input name="title" placeholder="Tên môn, ví dụ: Tin học" required maxlength="100"><input name="icon" value="📚" placeholder="Icon" maxlength="8" style="max-width:120px"><input name="description" placeholder="Mô tả (không bắt buộc)" maxlength="200"><button class="button">+ Thêm môn</button></form></div><div class="notice" style="margin-top:16px"><b>Định dạng đề JSON:</b> <code>{"exams":[{"title":"...","questions":[...] }]}</code>. Câu hỏi <code>mc</code> có đúng 4 <code>choices</code>; <code>tf</code> dùng answer <code>true</code>/<code>false</code>; <code>short</code> dùng answer dạng chuỗi hoặc mảng chuỗi. Có thể thêm <code>explanation</code>. Nội dung được lưu từ file, không tự sinh câu hỏi/đáp án.</div><div class="row" style="margin-top:12px"><button id="template" class="button ghost">Tải mẫu JSON</button></div>${cards||`<div class="card empty" style="margin-top:16px">Chưa có môn học. Thêm môn để bắt đầu.</div>`}`);const main=document.querySelector("#app");document.querySelector("#logout").onclick=async()=>{await signOut(auth);adminPin=null;location.hash="#/admin";};document.querySelector("#add-subject").onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.currentTarget)),id=newId();try{await setDoc(doc(db,"examSubjects",String(id)),{title:d.title.trim(),icon:d.icon.trim()||"📚",description:d.description.trim(),isPublished:true,order:id});await adminPage();}catch(err){alert(err.message);}};document.querySelector("#template").onclick=()=>download("mau-de-thi.json",JSON.stringify({exams:[{title:"Tên đề thi",description:"Mô tả đề",questions:[{type:"mc",question:"Nội dung câu hỏi",choices:["Lựa chọn A","Lựa chọn B","Lựa chọn C","Lựa chọn D"],answer:"Lựa chọn A",explanation:"Giải thích (không bắt buộc)"},{type:"tf",question:"Nội dung câu đúng/sai",answer:true},{type:"short",question:"Nội dung câu trả lời ngắn",answer:["Đáp án 1","Đáp án thay thế"]}]}]},null,2));main.querySelectorAll("[data-action]").forEach(b=>b.onclick=async()=>{const id=Number(b.dataset.id),a=b.dataset.action;try{if(a==="toggle-subject"){const x=subjects.find(v=>v.id===id);await setDoc(doc(db,"examSubjects",String(id)),{isPublished:x.isPublished===false},{merge:true});}else if(a==="toggle-test"){const x=tests.find(v=>v.id===id);await setDoc(doc(db,"exams",String(id)),{isPublished:x.isPublished===false},{merge:true});}else if(a==="delete-test"){const x=tests.find(v=>v.id===id);if(!confirm(`Xoá đề "${x.title}"?`))return;await deleteDoc(doc(db,"exams",String(id)));}else if(a==="delete-subject"){const x=subjects.find(v=>v.id===id);if(!confirm(`Xoá môn "${x.title}" và toàn bộ đề của môn?`))return;const owned=tests.filter(t=>Number(t.subjectId)===id);for(let k=0;k<owned.length;k+=400){const batch=writeBatch(db);owned.slice(k,k+400).forEach(t=>batch.delete(doc(db,"exams",String(t.id))));await batch.commit();}await deleteDoc(doc(db,"examSubjects",String(id)));}await adminPage();}catch(err){alert(err.message);}});main.querySelectorAll("[data-upload]").forEach(inp=>inp.onchange=async()=>{const f=inp.files[0];if(!f)return;try{if(!f.name.toLowerCase().endsWith(".json"))throw Error("Chỉ hỗ trợ file .json.");const imported=validateFile(JSON.parse(await f.text())),sid=Number(inp.dataset.upload),n=imported.reduce((a,x)=>a+x.questions.length,0);if(!confirm(`Nhập ${imported.length} đề (${n} câu) từ ${f.name}?`))return;for(const x of imported){if(new Blob([JSON.stringify(x.questions)]).size>850000)throw Error(`Đề "${x.title}" vượt giới hạn dung lượng Firestore.`);const id=newId();await setDoc(doc(db,"exams",String(id)),{subjectId:sid,title:x.title.trim(),description:x.description||"",questions:x.questions,sourceFileName:f.name,isPublished:true,order:id});}await adminPage();alert(`Đã nhập ${imported.length} đề.`);}catch(err){alert(err.message||"Không đọc được file.");}});}catch(err){shell(`<div class="card"><h2>Không tải được quản trị</h2><p>${esc(err.message)}</p><button class="button" onclick="location.reload()">Thử lại</button></div>`);}}
function download(name,text){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"application/json"}));a.download=name;a.click();URL.revokeObjectURL(a.href);}
async function render(){const p=path();if(p==="/"||p==="/index.html")return home();if(p==="/admin")return adminPage();const s=p.match(/^\/subject\/(\d+)$/);if(s)return subjectPage(Number(s[1]));const t=p.match(/^\/test\/(\d+)$/);if(t)return setup(Number(t[1]));const d=p.match(/^\/doing\/(\d+)$/);if(d){if(!session||session.examId!==Number(d[1]))return setup(Number(d[1]));return renderQuestion();}home();}
window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0);});
(async()=>{shell(`<div class="card empty">Đang tải dữ liệu Ôn thi…</div>`);await loadPublic();await render();})();
</script></body></html>
