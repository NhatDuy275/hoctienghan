<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ôn thi — Học tập</title>
<meta name="theme-color" content="#5676d8">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-180.png">
<style>
:root{--bg:#f6efe9;--surface:#fffaf6;--fg:#2b2528;--muted:#7a6f74;--primary:#5676d8;--primary-fg:#fff;--border:#e6d8d0;--ok:#2e9e5b;--r:16px}
@media(prefers-color-scheme:dark){:root{--bg:#17131a;--surface:#221c26;--fg:#f1e9ee;--muted:#a89ca3;--border:#392f3e}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:inherit;text-decoration:none}h1{font-size:clamp(2rem,5vw,3.2rem);line-height:1.15;margin:.2em 0}h2{margin:.2em 0}h3{margin:.3em 0}
.shell{min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:20px;padding:calc(12px + env(safe-area-inset-top,0px)) max(20px,calc((100% - 1100px)/2)) 12px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.2rem}
.mark{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:var(--primary);color:var(--primary-fg)}
.nav{display:flex;gap:4px;flex:1}.nav a{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;color:var(--muted)}
.nav a.active{background:var(--primary);color:var(--primary-fg)}
.user-pill{color:var(--muted);font-size:.9rem}
.exit-btn{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid var(--border);color:var(--muted);font-size:.9rem;white-space:nowrap}
.exit-btn:hover{color:var(--primary);border-color:var(--primary)}
.main{flex:1;width:100%;max-width:1100px;margin:0 auto;padding:32px 20px 60px}
.footer{text-align:center;color:var(--muted);font-size:.85rem;padding:20px 20px 30px}
@media(max-width:760px){.user-pill{display:none}.topbar{flex-wrap:wrap;gap:6px 12px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px}.nav{flex:1 0 100%;order:3}.nav a{flex:1;justify-content:center;padding:8px 4px;font-size:.9rem}.exit-btn{margin-left:auto}.main{padding:24px 14px 48px}}
.eyebrow{color:var(--primary);font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.lead{color:var(--muted);font-size:1.05rem}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px}
.button{display:inline-flex;align-items:center;gap:6px;border:0;cursor:pointer;font:inherit;font-weight:600;padding:10px 18px;border-radius:999px;background:var(--primary);color:var(--primary-fg)}
.button:hover{filter:brightness(1.08)}.button.secondary{background:transparent;color:var(--primary);border:1.5px solid var(--primary)}
.button.ghost{background:transparent;color:var(--fg);border:1px solid var(--border)}.button.sm{padding:5px 12px;font-size:.85rem}.button:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.section-head,.toolbar{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:24px 0 16px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.meta{margin-top:auto;display:flex;flex-direction:column;gap:10px;color:var(--muted);font-size:.9rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{display:inline-block;padding:3px 12px;border-radius:999px;background:color-mix(in srgb,var(--primary) 12%,transparent);color:var(--primary);font-size:.82rem;font-weight:600}
.exam-subject,.exam-test{transition:transform .15s,border-color .15s}.exam-subject:hover,.exam-test:hover{transform:translateY(-2px);border-color:var(--primary)}
.exam-icon{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:color-mix(in srgb,var(--primary) 12%,transparent);color:var(--primary);font-size:1.7rem}
.exam-test{display:flex;flex-direction:column;gap:8px}
.empty{text-align:center;padding:40px 20px}.empty h1{font-size:3rem;color:var(--primary)}
.notice{padding:12px 16px;border-radius:12px;background:color-mix(in srgb,var(--primary) 10%,transparent);color:var(--muted)}
.answer-list{display:grid;gap:10px;margin-top:16px}
.answer{font:inherit;text-align:left;padding:14px 18px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface);color:var(--fg);cursor:pointer}
.answer:hover{border-color:var(--primary)}.answer:disabled{cursor:default}
.answer.sel{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 12%,var(--surface))}
.answer.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--surface))}
.answer.wrong{border-color:#d64545;background:color-mix(in srgb,#d64545 12%,var(--surface))}
.exam-question{font-size:1.2rem;font-weight:700;white-space:pre-line}
.fb{margin:14px 0;padding:12px 16px;border-radius:12px}.fb.right{background:color-mix(in srgb,var(--ok) 15%,transparent)}.fb.wrong{background:color-mix(in srgb,#d64545 12%,transparent)}
.exam-progress{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.exam-dot{width:30px;height:30px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--border);font:inherit;font-size:.8rem;color:inherit;cursor:pointer}
.exam-dot:disabled{cursor:default}.exam-dot.current{background:var(--primary);color:var(--primary-fg)}
.exam-dot.done{background:color-mix(in srgb,var(--ok) 22%,var(--surface));color:var(--ok)}.exam-dot.current.done{background:var(--primary);color:var(--primary-fg)}
.review{margin-bottom:10px}.review.right{border-left:4px solid var(--ok)}.review.wrong{border-left:4px solid #d64545}.review p{margin:.3em 0}
.opt{position:relative}.opt input{position:absolute;opacity:0;width:0;height:0;flex:none;padding:0;border:0}
.opt span{display:inline-block;padding:8px 14px;border-radius:999px;border:1.5px solid var(--border);cursor:pointer;background:var(--surface)}
.opt input:checked+span{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}.opt input:focus-visible+span{outline:3px solid var(--primary);outline-offset:2px}
.qgroup{margin:18px 0 8px}
.bar{height:6px;border-radius:9px;background:var(--border);overflow:hidden;margin-bottom:6px}.bar i{display:block;height:100%;background:var(--primary)}
.field{display:grid;gap:4px;margin-bottom:12px;font-size:.9rem;color:var(--muted)}
textarea,input:not([type=file]):not([type=radio]){width:100%;font:inherit;padding:10px 14px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--fg)}
textarea{min-height:70px;resize:vertical}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--border)}
.danger{color:#d64545!important}summary{cursor:pointer;font-weight:600}code{overflow-wrap:anywhere}
table{border-collapse:collapse;width:100%;font-size:.9rem}th,td{padding:6px 10px;border-bottom:1px solid var(--border);text-align:left}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
.skeleton{min-height:140px;background:linear-gradient(90deg,var(--surface) 25%,color-mix(in srgb,var(--border) 60%,var(--surface)) 50%,var(--surface) 75%);background-size:200% 100%;animation:sk 1.3s ease-in-out infinite}
@keyframes sk{to{background-position:-200% 0}}
.main{padding-bottom:calc(60px + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.button:disabled{opacity:.5;cursor:not-allowed}.button:active{transform:translateY(1px)}
@media(pointer:coarse){.button,.nav a,.answer,.opt span,.exit-btn{min-height:44px}.button.sm{min-height:40px}}
@media(prefers-reduced-motion:reduce){.skeleton{animation:none}}
</style>
</head>
<body><div id="app"></div>
<script type="module">
// Ôn thi – 1 web duy nhất + Firebase (Firestore + Authentication), hash routing. Giao diện & cách dùng giống Hangul.
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, setPersistence, inMemoryPersistence, signInWithEmailAndPassword, signOut, updatePassword } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, doc, getDocs, setDoc, deleteDoc, query, where, writeBatch } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyDVfyRcI8GMyd56H6Agj2qUmzH-K1uTyG4", authDomain: "onthi-cdfc5.firebaseapp.com", projectId: "onthi-cdfc5", appId: "1:21467745610:web:4d8b176c45d56b3b3d45b3" };
const ADMIN_EMAIL = "nguyenduy27529@gmail.com";  // "mã quản trị" = mật khẩu của tài khoản này trong Authentication
const HOME_URL = "./index.html#/";               // nút ⏻ Thoát quay về màn hình chờ của Hangul

const fbApp = initializeApp(firebaseConfig), db = getFirestore(fbApp), auth = getAuth(fbApp);
const authReady = setPersistence(auth, inMemoryPersistence);
const SUBJECTS = [], EXAMS = [];
let loadError = "", adminPin = null;

let lastId = 0;
const newId = () => (lastId = Math.max(lastId + 1, Date.now() * 100));
const fromDoc = d => ({ ...d.data(), id: Number(d.id) });
const byOrder = (a, b) => (a.order ?? 0) - (b.order ?? 0) || a.id - b.id;
const fillData = (s, e) => { SUBJECTS.splice(0, SUBJECTS.length, ...[...s].sort(byOrder)); EXAMS.splice(0, EXAMS.length, ...[...e].sort(byOrder)); };
const CACHE_KEY = "onthi.content.cache.v1";
function readCache() {  // hiện ngay nội dung đã lưu trên máy, cập nhật nền sau
  try { const c = JSON.parse(localStorage.getItem(CACHE_KEY)); if (c && Array.isArray(c.S) && Array.isArray(c.E)) { fillData(c.S, c.E); return true; } } catch {}
  return false;
}
async function loadPublic() {
  for (let attempt = 0; attempt < 2; attempt++) {  // thử lại 1 lần khi mạng chập chờn
    try {
      if (adminPin === null && auth.currentUser) await signOut(auth);
      const [s, e] = await Promise.all([getDocs(query(collection(db, "examSubjects"), where("isPublished", "==", true))), getDocs(query(collection(db, "exams"), where("isPublished", "==", true)))]);
      const S = s.docs.map(fromDoc), E = e.docs.map(fromDoc);
      loadError = "";
      if (adminPin !== null) return;  // đang ở phiên quản trị: không ghi đè dữ liệu đầy đủ của admin
      fillData(S, E); try { localStorage.setItem(CACHE_KEY, JSON.stringify({ S, E })); } catch {}
      return;
    } catch (err) {
      loadError = err?.message || String(err);
      if (attempt === 0) await new Promise(r => setTimeout(r, 1200));
    }
  }
  readCache();
}

// ---------- Lưu trữ local (hồ sơ + lịch sử làm bài) ----------
const STORE_KEY = "onthi.local.v1";
const state = (() => { try { return { user: null, sessions: [], ...JSON.parse(localStorage.getItem(STORE_KEY) || "{}") }; } catch { return { user: null, sessions: [] }; } })();
const save = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify({ user: state.user, sessions: state.sessions })); } catch {} };

// ---------- Tiện ích ----------
const app = document.querySelector("#app");
const path = () => location.hash.slice(1) || "/";
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const shuffle = a => a.map(x => [Math.random(), x]).sort((p, q) => p[0] - q[0]).map(x => x[1]);
const TL = { mc: "Trắc nghiệm", tf: "Đúng/Sai", short: "Trả lời ngắn" };
const tsum = qs => ["mc", "tf", "short"].map(t => [TL[t].toLowerCase(), qs.filter(q => q.type === t).length]).filter(x => x[1]).map(([l, n]) => `${n} ${l}`).join(" · ");
const subject = id => SUBJECTS.find(x => x.id === id);
const testsFor = id => EXAMS.filter(x => x.subjectId === id && x.isPublished !== false);
const testById = id => EXAMS.find(x => x.id === id && x.isPublished !== false);
const opt = (name, val, label, cfg) => `<label class="opt"><input type="radio" name="${name}" value="${val}" ${String(cfg[name]) === String(val) ? "checked" : ""}><span>${label}</span></label>`;
const lnk = (href, title) => `<a href="#${href}" class="${path() === href ? "active" : ""}">${title}</a>`;

function shell(content) {
  app.innerHTML = `<div class="shell"><header class="topbar"><a href="#/" class="brand"><span class="mark">✎</span>Ôn thi</a><nav class="nav">${lnk("/", "Môn học")}${lnk("/profile", "Tôi")}</nav><span class="user-pill">${state.user ? `Xin chào, ${esc(state.user.name)}` : "Học từ đề thi thật"}</span><a href="${HOME_URL}" class="exit-btn" aria-label="Thoát ra màn hình chờ">⏻ <span>Thoát</span></a></header><main class="main">${loadError ? `<div class="notice" style="margin-bottom:16px">Không tải được dữ liệu từ Firebase — đang dùng dữ liệu đã lưu trên máy (nếu có). Lý do: <b>${esc(loadError)}</b></div>` : ""}${content}</main><footer class="footer">Ôn thi · Học từ đề thi do quản trị viên cung cấp. · <a href="#/admin">Quản trị</a></footer></div>`;
}

// ---------- Trang: môn học → đề thi → chế độ ----------
function home() {
  const ss = SUBJECTS.filter(s => s.isPublished !== false);
  shell(`<div class="eyebrow">Thư viện đề thi</div><h1>Ôn thi</h1><p class="lead">Chọn môn học để xem các đề thi.</p><div class="grid">${ss.map(s => `<a class="card exam-subject" href="#/subject/${s.id}"><div class="row"><span class="exam-icon">${esc(s.icon || "📚")}</span><div><h2>${esc(s.title)}</h2><span class="chip">${testsFor(s.id).length} đề thi</span></div></div>${s.description ? `<p class="lead">${esc(s.description)}</p>` : ""}</a>`).join("") || `<div class="card empty">Chưa có môn học nào. Hãy quay lại sau nhé.</div>`}</div>`);
}
function subjectPage(id) {
  const s = subject(id); if (!s) return home();
  const ts = testsFor(id);
  shell(`<div class="toolbar"><a class="button ghost" href="#/">← Các môn học</a><span class="chip">${esc(s.icon || "📚")} ${esc(s.title)}</span></div><div class="eyebrow">Chọn đề thi</div><h1>${esc(s.title)}</h1><p class="lead">${esc(s.description || "Chọn đề để bắt đầu ôn tập.")}</p><div class="grid">${ts.map(t => `<article class="card exam-test"><span class="eyebrow">${t.questions.length} câu hỏi</span><h2>${esc(t.title)}</h2>${t.description ? `<p class="lead">${esc(t.description)}</p>` : ""}<div class="meta"><span>${tsum(t.questions)}</span><a class="button" href="#/test/${t.id}">Bắt đầu →</a></div></article>`).join("") || `<div class="card empty">Môn này hiện chưa có đề thi.</div>`}</div>`);
}

let scfg = { mode: "chill", shuf: "0", shufc: "0" }, session = null;
function setup(id) {
  const t = testById(id);
  if (!t || !Array.isArray(t.questions) || !t.questions.length) return shell(`<div class="card empty">Không tìm thấy đề thi. <a href="#/" style="color:var(--primary)">Về trang chủ</a></div>`);
  const s = subject(t.subjectId), hasMc = t.questions.some(q => q.type === "mc");
  session = null;
  shell(`<div class="toolbar"><a class="button ghost" href="#/subject/${t.subjectId}">← ${esc(s?.title || "Môn học")}</a><span class="chip">${t.questions.length} câu</span></div><h1>${esc(t.title)}</h1><p class="lead">${esc(t.description || tsum(t.questions))}</p><form id="sform" class="card">
<div class="eyebrow">Chế độ</div><div class="row qgroup">${opt("mode", "chill", "😌 Chill", scfg)}${opt("mode", "hard", "🔥 Try hard", scfg)}</div>
<div class="eyebrow">Thứ tự câu hỏi</div><div class="row qgroup">${opt("shuf", "0", "Theo đề", scfg)}${opt("shuf", "1", "Xáo trộn", scfg)}</div>
${hasMc ? `<div class="eyebrow">Thứ tự đáp án trắc nghiệm</div><div class="row qgroup">${opt("shufc", "0", "Theo đề", scfg)}${opt("shufc", "1", "Xáo trộn", scfg)}</div>` : ""}
<p class="notice"><b>Chill:</b> làm xong mỗi câu bấm Nộp là thấy đáp án ngay, sai thì có giải thích.<br><b>Try hard:</b> làm hết đề mới thấy đáp án và giải thích câu sai.</p>
<button class="button" style="margin-top:16px">Bắt đầu →</button></form>`);
  document.querySelector("#sform").onsubmit = e => {
    e.preventDefault(); const d = new FormData(e.currentTarget);
    scfg = { mode: d.get("mode"), shuf: d.get("shuf"), shufc: d.get("shufc") || scfg.shufc }; begin(t);
  };
}
function begin(t, only) {  // only: danh sách câu (dùng cho "làm lại câu sai")
  let qs = only || t.questions; if (scfg.shuf === "1") qs = shuffle(qs);
  qs = qs.map(q => q.type === "mc" && scfg.shufc === "1" ? { ...q, choices: shuffle(q.choices) } : q);
  session = { examId: t.id, subjectId: t.subjectId, title: t.title, mode: scfg.mode, qs, i: 0, ans: [], locked: [] };
  const target = `/doing/${t.id}`; if (path() === target) renderQuestion(); else location.hash = "#" + target;
}

// ---------- Làm bài ----------
const tfAns = q => Array.isArray(q.answer) ? q.answer : [q.answer];
const nn = s => String(s ?? "").normalize("NFC").trim().toLocaleLowerCase("vi").replace(/\s+/g, " ");
const sameShort = (x, a) => nn(x) === nn(a) || (nn(a) !== "" && Number.isFinite(+nn(x).replace(",", ".")) && +nn(x).replace(",", ".") === +nn(a).replace(",", "."));
const isOk = (q, a) => q.type === "mc" ? a === q.answer : q.type === "tf" ? Array.isArray(a) && tfAns(q).every((v, k) => a[k] === v) : typeof a === "string" && (Array.isArray(q.answer) ? q.answer : [q.answer]).some(x => sameShort(x, a));
const hasAns = (q, a) => q.type === "mc" ? typeof a === "string" : q.type === "tf" ? Array.isArray(a) && tfAns(q).every((_, k) => typeof a[k] === "boolean") : !!String(a ?? "").trim();
const lt = k => String.fromCharCode(97 + k);
const tfText = (q, v) => tfAns(q).map((_, k) => (tfAns(q).length > 1 ? lt(k) + ") " : "") + (v?.[k] === undefined ? "(bỏ trống)" : v[k] ? "Đúng" : "Sai")).join(" · ");
const ansText = q => q.type === "mc" ? q.answer : q.type === "tf" ? tfText(q, tfAns(q)) : (Array.isArray(q.answer) ? q.answer.join(" / ") : String(q.answer));
const userText = (q, a) => q.type === "tf" ? tfText(q, a) : (String(a ?? "").trim() || "(bỏ trống)");

function renderQuestion() {
  const z = session; if (!z) return home();
  const { qs, i, mode } = z, q = qs[i], a = z.ans[i], show = !!z.locked[i], chill = mode === "chill", last = i === qs.length - 1, ok = show && isOk(q, a);
  let body = "";
  if (q.type === "mc") body = `<div class="answer-list">${q.choices.map(c => `<button class="answer${a === c ? " sel" : ""}${show && c === q.answer ? " right" : ""}${show && a === c && c !== q.answer ? " wrong" : ""}" data-choice="${esc(c)}" ${show ? "disabled" : ""}>${esc(c)}</button>`).join("")}</div>`;
  else if (q.type === "tf") body = `<div class="answer-list">${(q.items?.length ? q.items : [null]).map((t, k) => `<div class="card" style="padding:12px 16px">${t != null ? `<p style="margin:0 0 8px">${lt(k)}) ${esc(t)}</p>` : ""}<div class="row">${[true, false].map(v => `<button class="answer${a?.[k] === v ? " sel" : ""}${show && tfAns(q)[k] === v ? " right" : ""}${show && a?.[k] === v && tfAns(q)[k] !== v ? " wrong" : ""}" data-tf="${k}:${v}" ${show ? "disabled" : ""}>${v ? "Đúng" : "Sai"}</button>`).join("")}</div></div>`).join("")}</div>`;
  else body = `<label class="field" style="margin-top:16px"><span>Câu trả lời của bạn</span><input id="short" autocomplete="off" value="${esc(a || "")}" placeholder="Nhập câu trả lời…" ${show ? "disabled" : ""}></label>`;
  const fb = show ? `<div class="fb ${ok ? "right" : "wrong"}">${ok ? "✓ Chính xác!" : `✗ Chưa đúng. Đáp án: <b>${esc(ansText(q))}</b>${q.explanation ? `<p style="margin:.6em 0 0">💡 <b>Giải thích:</b> ${esc(q.explanation)}</p>` : ""}`}</div>` : "";
  const nav = chill ? (show ? `<button class="button" id="next">${last ? "Xem kết quả" : "Câu tiếp →"}</button>` : `<button class="button" id="submit" ${hasAns(q, a) ? "" : "disabled"}>Nộp câu</button>`)
    : `${i > 0 ? `<button class="button ghost" id="prev">← Trước</button>` : ""}<button class="button" id="next">${last ? "Nộp bài" : "Câu tiếp →"}</button>`;

async function unzip(buf) {

    out[name] = method === 0 ? data : new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer());
  }
  return out;
}

  const z = await unzip(await file.arrayBuffer());

  if (!sheet) throw new Error("Không tìm thấy trang tính trong file.");

      row[colIndex(c.getAttribute("r"))] = t === "s" ? shared[+v] : t === "inlineStr" ? text(c) : v;

    const o = [2, 3, 4, 5].map(k => String(c[k] ?? "").trim()), filled = o.filter(Boolean), extra = exp ? { explanation: exp } : {};
    let t = typeOf(c[0]);
    if (!t) t = filled.length >= 2 && /^[A-Da-d]$/.test(ansRaw) ? "mc" : parseTf(ansRaw) ? "tf" : "short";
    if (t === "mc") {
      const k = /^[A-Da-d]$/.test(ansRaw) ? ansRaw.toUpperCase().charCodeAt(0) - 65 : o.findIndex(x => x && nn(x) === nn(ansRaw));
      if (filled.length < 2) return bad("trắc nghiệm cần ít nhất 2 phương án");
      if (k < 0 || !o[k]) return bad("đáp án không khớp phương án nào");
      questions.push({ type: "mc", question, choices: filled, answer: o[k], ...extra });
    } else if (t === "tf") {
      const v = parseTf(ansRaw), items = filled.length >= 2 ? filled : [];
      if (!v) return bad("đáp án đúng/sai không hợp lệ (dùng Đúng/Sai hoặc Đ/S)");
      if (v.length !== (items.length || 1)) return bad(`số đáp án (${v.length}) khác số ý (${items.length || 1})`);
      questions.push(items.length ? { type: "tf", question, items, answer: v, ...extra } : { type: "tf", question, answer: v[0], ...extra });
    } else {
      const l = ansRaw.split("|").map(x => x.trim()).filter(Boolean);
      questions.push({ type: "short", question, answer: l.length > 1 ? l : l[0], ...extra });
    }
  });
  if (!questions.length) return alert(skipped.length ? "Không có câu hợp lệ.\n" + skipped.slice(0, 6).join("\n") : "File trống.");
  setPending([{ title, questions, sourceFileName: source }], skipped);
}
function validateFile(d) {  // file JSON {"exams":[{title,description?,questions:[...]}]}
  if (!d || !Array.isArray(d.exams) || !d.exams.length) throw Error('File cần có danh sách "exams".');
  d.exams.forEach((e, ei) => {
    if (!e || typeof e.title !== "string" || !e.title.trim() || !Array.isArray(e.questions) || !e.questions.length) throw Error(`Đề ${ei + 1}: cần title và questions.`);
    e.questions.forEach((q, qi) => {
      const at = `Đề ${ei + 1}, câu ${qi + 1}`;
      if (!q || typeof q.question !== "string" || !q.question.trim()) throw Error(`${at}: thiếu question.`);
      if (q.type === "mc") { if (!Array.isArray(q.choices) || q.choices.length < 2 || q.choices.some(x => typeof x !== "string" || !x.trim())) throw Error(`${at}: mc cần ít nhất 2 choices dạng văn bản.`); if (typeof q.answer !== "string" || !q.choices.includes(q.answer)) throw Error(`${at}: answer phải khớp một lựa chọn.`); }
      else if (q.type === "tf") { const ok = typeof q.answer === "boolean" || (Array.isArray(q.answer) && q.answer.length && q.answer.every(x => typeof x === "boolean") && Array.isArray(q.items) && q.items.length === q.answer.length); if (!ok) throw Error(`${at}: tf cần answer true/false (hoặc mảng answer + items cùng độ dài).`); }
      else if (q.type === "short") { if (!(typeof q.answer === "string" && q.answer.trim()) && !(Array.isArray(q.answer) && q.answer.length && q.answer.every(x => typeof x === "string" && x.trim()))) throw Error(`${at}: short cần answer là chuỗi hoặc mảng chuỗi.`); }
      else throw Error(`${at}: type phải là mc, tf hoặc short.`);
      if (q.explanation != null && typeof q.explanation !== "string") throw Error(`${at}: explanation phải là văn bản.`);
    });
  });
  return d.exams;
}
function setPending(exams, skipped, source) { adminPending = { exams, skipped }; admin(); }
async function pickExam(file) {
  if (!file) return;
  try {
    const name = file.name.toLowerCase(), title = document.querySelector("#ex-title")?.value.trim() || file.name.replace(/\.[^.]+$/, "");
    if (name.endsWith(".xls")) throw new Error("File .xls (Excel cũ) chưa hỗ trợ. Hãy lưu lại dạng .xlsx hoặc CSV UTF-8.");
    if (name.endsWith(".json")) return setPending(validateFile(JSON.parse(await file.text())).map(x => ({ ...x, sourceFileName: file.name })), []);
    if (name.endsWith(".xlsx")) return stageRows(await readXlsx(file), title, file.name);
    const txt = await file.text();
    if (txt.includes("\ufffd")) throw new Error("File không phải UTF-8. Trong Excel chọn Save As → CSV UTF-8, hoặc dùng .xlsx.");
    stageRows(textRows(txt), title, file.name);
  } catch (e) { alert(e.message || "Không đọc được file."); }
}

async function adminClick(e) {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, id = Number(b.dataset.id), i = Number(b.dataset.i);
  const subjTests = () => EXAMS.filter(x => x.subjectId === adminSubjId);
  switch (a) {
    case "tab": adminTab = b.dataset.tab; adminEdit = null; adminSubjId = null; adminPending = null; return admin();
    case "lock": await signOut(auth).catch(() => {}); adminPin = null; await loadPublic(); return admin();
    case "cancel": adminEdit = null; return admin();
    case "cancel-import": adminPending = null; return admin();
    case "open": adminSubjId = id; adminPending = null; return admin();
    case "back": adminSubjId = null; adminPending = null; return admin();
    case "new-subj": adminEdit = { k: "subj", id: null }; return admin();
    case "edit-subj": adminEdit = { k: "subj", id }; return admin();
    case "edit-test": adminEdit = { k: "test", id }; return admin();
    case "toggle-subj": return act(() => setDoc(doc(db, "examSubjects", String(id)), { isPublished: subject(id).isPublished === false }, { merge: true }));
    case "toggle-test": { const t = EXAMS.find(x => x.id === id); return act(() => setDoc(doc(db, "exams", String(id)), { isPublished: t.isPublished === false }, { merge: true })); }
    case "up-subj": return reorder("examSubjects", SUBJECTS, i, -1);
    case "down-subj": return reorder("examSubjects", SUBJECTS, i, 1);
    case "up-test": return reorder("exams", subjTests(), i, -1);
    case "down-test": return reorder("exams", subjTests(), i, 1);
    case "del-subj": {
      const s = subject(id), owned = EXAMS.filter(t => t.subjectId === id);
      if (!confirm(`Xoá môn "${s.title}" và ${owned.length} đề thi trong đó?`)) return;
      return act(() => commitAll([bt => bt.delete(doc(db, "examSubjects", String(id))), ...owned.map(t => bt => bt.delete(doc(db, "exams", String(t.id))))]));
    }
    case "del-test": { const t = EXAMS.find(x => x.id === id); if (!confirm(`Xoá đề "${t.title}"?`)) return; return act(() => deleteDoc(doc(db, "exams", String(id)))); }
    case "confirm-import": {
      const p = adminPending; adminPending = null;
      return act(async () => {
        for (const x of p.exams) {
          if (new Blob([JSON.stringify(x.questions)]).size > 850000) throw Error(`Đề "${x.title}" vượt giới hạn dung lượng Firestore (≈1 MB). Hãy tách thành 2 đề.`);
          const nid = newId(), data = { subjectId: adminSubjId, title: x.title.trim(), description: x.description || "", questions: x.questions, isPublished: true, order: nid };
          if (x.sourceFileName) data.sourceFileName = x.sourceFileName;
          await setDoc(doc(db, "exams", String(nid)), data);
        }
        alert(`Đã lưu ${p.exams.length} đề thi.`);
      });
    }
    case "tpl-csv": return download("mau-de-thi.csv", "\ufeffsep=,\n" + [
      ["Loại", "Câu hỏi", "A", "B", "C", "D", "Đáp án", "Giải thích"],
      ["Trắc nghiệm", "Phần mềm nào sau đây là phần mềm bảng tính?", "Word", "Excel", "PowerPoint", "Paint", "B", "Excel dùng để xử lý bảng tính."],
      ["Đúng sai", "Internet là mạng máy tính toàn cầu.", "", "", "", "", "Đúng", ""],
      ["Đúng sai", "Xét các phát biểu về mạng máy tính:", "Router kết nối các mạng với nhau", "LAN là mạng diện rộng", "Wi-Fi là mạng không dây", "Switch dùng để soạn thảo văn bản", "Đ,S,Đ,S", "LAN là mạng cục bộ; Switch là thiết bị mạng."],
      ["Trả lời ngắn", "CPU viết tắt của cụm từ nào (tiếng Anh)?", "", "", "", "", "Central Processing Unit", "CPU là bộ xử lý trung tâm."]
    ].map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\n"), "text/csv");
    case "tpl-json": return download("mau-de-thi.json", JSON.stringify({ exams: [{ title: "Tên đề thi", description: "Mô tả đề", questions: [
      { type: "mc", question: "Nội dung câu hỏi", choices: ["Lựa chọn A", "Lựa chọn B", "Lựa chọn C", "Lựa chọn D"], answer: "Lựa chọn A", explanation: "Giải thích (không bắt buộc)" },
      { type: "tf", question: "Nội dung câu đúng/sai", answer: true },
      { type: "tf", question: "Câu đúng/sai nhiều ý", items: ["Ý a", "Ý b"], answer: [true, false] },
      { type: "short", question: "Nội dung câu trả lời ngắn", answer: ["Đáp án 1", "Đáp án thay thế"] }] }] }, null, 2));
    case "export": return download("onthi-backup.json", JSON.stringify({ subjects: SUBJECTS, exams: EXAMS }, null, 2));
  }
}
async function adminSubmit(e) {
  e.preventDefault();
  const f = e.target, kind = f.dataset.form, d = Object.fromEntries(new FormData(f)), t = s => String(s ?? "").trim();
  if (kind === "subj") {
    const id = adminEdit.id; adminEdit = null; const s = id && subject(id), nid = id ?? newId();
    return act(() => setDoc(doc(db, "examSubjects", String(nid)), { title: t(d.title), icon: t(d.icon) || "📚", description: t(d.description), ...(s ? {} : { isPublished: true, order: nid }) }, { merge: true }));
  }
  if (kind === "test") { const id = adminEdit.id; adminEdit = null; return act(() => setDoc(doc(db, "exams", String(id)), { title: t(d.title), description: t(d.description) }, { merge: true })); }
  if (kind === "ecsv") return stageRows(textRows(String(d.ecsv)), t(d.title) || "Đề mới", "");
  if (kind === "pin") {
    try { await updatePassword(auth.currentUser, t(d.pin)); adminPin = t(d.pin); alert("Đã đổi mã quản trị."); } catch (err) { alert(err.message); }
  }
}
function admin() {
  if (adminPin === null) return adminGate();
  const tabs = [["subjects", "Môn học & đề thi"], ["data", "Dữ liệu"]];
  const body = adminEdit ? adminForm() : adminTab === "subjects" ? (adminSubjId ? adminTests() : adminSubjects()) : adminData();
  shell(`<div class="eyebrow">Quản trị</div><h1>Quản lý Ôn thi</h1><div class="row">${tabs.map(([k, v]) => btn("tab", v, `data-tab="${k}"`, adminTab === k && !adminEdit ? "" : "ghost")).join("")}${btn("lock", "Khoá", "", "ghost")}</div><div style="margin-top:20px">${body}</div>`);
  const main = document.querySelector("#app");
  main.onclick = adminClick; main.onsubmit = adminSubmit;
  main.onchange = async ev => {
    if (ev.target.id === "imp-exam") return pickExam(ev.target.files[0]);
    if (ev.target.id !== "imp-backup") return;
    try {
      const d = JSON.parse(await ev.target.files[0].text()), idOk = x => x && Number.isFinite(Number(x.id)) && Number(x.id) > 0;
      if (!Array.isArray(d.subjects) || !Array.isArray(d.exams) || !d.subjects.every(x => idOk(x) && typeof x.title === "string" && x.title.trim())
        || !d.exams.every(x => idOk(x) && Number.isFinite(Number(x.subjectId)))) throw Error("File sao lưu không hợp lệ.");
      if (d.exams.length) validateFile({ exams: d.exams });  // kiểm tra từng câu hỏi, lỗi thì báo rõ đề/câu nào
      if (!confirm(`Thay thế TOÀN BỘ nội dung trên Firebase bằng file này (${d.subjects.length} môn, ${d.exams.length} đề)?\nTrình duyệt sẽ tự tải về một bản sao lưu nội dung hiện tại trước khi thay.`)) return;
      download(`onthi-truoc-khi-thay-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify({ subjects: SUBJECTS, exams: EXAMS }, null, 2));
      const [os, oe] = await Promise.all([getDocs(collection(db, "examSubjects")), getDocs(collection(db, "exams"))]);
      const put = (col, x) => { const { id, ...rest } = x; return b => b.set(doc(db, col, String(Number(id))), rest); };
      const keep = new Set([...d.subjects.map(x => `examSubjects/${Number(x.id)}`), ...d.exams.map(x => `exams/${Number(x.id)}`)]);
      // ghi dữ liệu mới TRƯỚC, chỉ xoá những bản cũ không còn trong file SAU CÙNG: lỗi giữa chừng không làm mất dữ liệu
      act(() => commitAll([...d.subjects.map(x => put("examSubjects", x)), ...d.exams.map(x => put("exams", x)), ...[...os.docs, ...oe.docs].filter(x => !keep.has(x.ref.path)).map(x => b => b.delete(x.ref))]));
    } catch (err) { alert(err?.message || "File sao lưu không hợp lệ."); }
  };
}

function render() {
  const p = path();
  if (p === "/" || p === "/index.html") return home();
  if (p === "/profile") return profile();
  if (p === "/admin") return admin();
  let m;
  if ((m = p.match(/^\/subject\/(\d+)$/))) return subjectPage(Number(m[1]));
  if ((m = p.match(/^\/test\/(\d+)$/))) return setup(Number(m[1]));
  if ((m = p.match(/^\/doing\/(\d+)$/))) return session && session.examId === Number(m[1]) ? renderQuestion() : setup(Number(m[1]));
  home();
}
window.addEventListener("hashchange", () => {
  if (path() !== "/admin" && adminPin !== null) { adminPin = null; signOut(auth).catch(() => {}); }  // rời khu quản trị = đóng phiên
  render(); window.scrollTo(0, 0);
});
(async function init() {
  const cached = readCache();
  if (cached) render();  // có bản lưu: hiện ngay, cập nhật nền
  else shell(`<div class="eyebrow">Đang tải…</div><div class="grid" aria-busy="true" aria-label="Đang tải dữ liệu">${'<div class="card skeleton"></div>'.repeat(4)}</div>`);
  await loadPublic();
  if (!cached || ["/", "/profile"].includes(path())) render();  // không làm gián đoạn bài đang làm
})();
